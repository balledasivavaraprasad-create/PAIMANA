name: CI Pipeline - Validation, Tests & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # JOB 1: Backend & PAIMANA Agent Test Suite
  # ========================================================
  backend-agent-tests:
    name: Backend & PAIMANA Agent Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MONGODB_URL: ${{ secrets.MONGODB_URL || 'mongodb://localhost:27017' }}
      MONGODB_DB_NAME: paimana_test_ci
      SECRET_KEY: test-secret-key-paimana-ci-2026
      N8N_RISK_WEBHOOK_URL: http://localhost:5678/webhook/mock
      N8N_THRESHOLD_WEBHOOK_URL: http://localhost:5678/webhook/mock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run Backend & Agent Test Suite with Coverage
        run: |
          cd backend
          pytest tests -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload Python coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 7

  # ========================================================
  # JOB 2: Frontend Tests & Production Build
  # ========================================================
  frontend-tests-and-build:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Run Frontend Vitest Test Suite
        run: npm test

      - name: Build Frontend Production Artifact (Vite)
        run: npm run build

      - name: Verify build artifacts exist
        run: |
          test -f dist/index.html
          test -d dist/assets

  # ========================================================
  # JOB 3: Security & Lint Gate
  # ========================================================
  security-and-lint:
    name: Security & Syntax Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for committed credential patterns
        run: |
          echo "Scanning for accidentally committed API keys..."
          ! grep -rn "AIzaSy" --exclude-dir={.git,node_modules,dist,.venv} --exclude="*.md" --exclude="*.yml" .
          ! grep -rn "mongodb+srv://.*:.*@" --exclude-dir={.git,node_modules,dist,.venv,backend} --exclude="*.md" --exclude="*.yml" .

  # ========================================================
  # JOB 4: Final Gate: Required Checks Success
  # ========================================================
  ci-gate:
    name: CI Passed Gate
    needs: [backend-agent-tests, frontend-tests-and-build, security-and-lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate All Test Results
        run: |
          if [ "${{ needs.backend-agent-tests.result }}" != "success" ]; then
            echo "❌ Backend & Agent tests failed!"
            exit 1
          fi
          if [ "${{ needs.frontend-tests-and-build.result }}" != "success" ]; then
            echo "❌ Frontend tests or build failed!"
            exit 1
          fi
          if [ "${{ needs.security-and-lint.result }}" != "success" ]; then
            echo "❌ Security or lint check failed!"
            exit 1
          fi
          echo "✅ All CI checks passed successfully! Ready for Deployment."
